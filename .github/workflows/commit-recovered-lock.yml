name: Commit reviewed dependency lockfile
on:
  push:
    branches: [feat/three-market-character-foundation]
    paths: [.github/workflows/commit-recovered-lock.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'asaffilate01-ship-it/stemcoach'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce and validate recovered lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json
          git diff --check -- package-lock.json
      - name: Commit only the regenerated lockfile (no force push)
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "Repair npm dependency lockfile after validated clean install"
          git push origin HEAD:refs/heads/feat/three-market-character-foundation
