name: Release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stemcoach-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_ENABLE_DEV_TOOLS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Record refreshed lockfile patch
        run: |
          echo 'LOCKFILE_PATCH_BEGIN'
          git --no-pager diff --no-color -- package-lock.json
          echo 'LOCKFILE_PATCH_END'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        run: npm audit --include=dev --audit-level=high || true
      - run: npm run release:preflight
