name: Recover npm lockfile (review artifact)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/lockfile-recovery.yml
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserve regenerated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
